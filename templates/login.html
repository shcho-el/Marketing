<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ clinic }} 콘텐츠 콘솔</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="{{ url_for('static', filename='console.css') }}" />
</head>
<body>
  <div class="login-shell">
    <form class="login-card" method="post">
      <h1>{{ clinic }}</h1>
      <p class="sub">콘텐츠 콘솔</p>
      <div class="field">
        <label for="pw">비밀번호</label>
        <input type="text" style="-webkit-text-security:disc" hidden />
        <input type="password" id="pw" name="password" autofocus
               autocomplete="current-password" />
      </div>
      <button class="btn" type="submit" style="width:100%">들어가기</button>
      {% if error %}<div class="note bad" style="margin-top:12px">{{ error }}</div>{% endif %}
    </form>
  </div>
</body>
</html>
