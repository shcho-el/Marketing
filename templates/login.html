<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ clinic }} 콘텐츠 콘솔</title>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
<style>
:root {
  --ground:#FFFFFF; --surface:#FFFFFF; --line:#E6E1DC;
  --ink:#16120F; --ink-3:#A0968D;
  /* PANTONE 16-1459 TCX Mandarin Orange */
  --accent:#E8703A; --accent-deep:#C85425; --on-accent:#FFFFFF;
  --bad:#BC2949; --bad-bg:#FAE6EB;
  --sans: Pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont,
          "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:#100E0D; --surface:#171412; --line:#2E2823;
    --ink:#F4F0EC; --ink-3:#7C7168;
    --accent:#FF8A57; --accent-deep:#FFA274; --on-accent:#1A0F09;
    --bad:#F27391; --bad-bg:#2C1219;
  }
}
:root[data-theme="dark"] {
  --ground:#100E0D; --surface:#171412; --line:#2E2823;
  --ink:#F4F0EC; --ink-3:#7C7168;
  --accent:#FF8A57; --accent-deep:#FFA274; --on-accent:#1A0F09;
  --bad:#F27391; --bad-bg:#2C1219;
}
* { box-sizing: border-box; }
body {
  margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
  background:var(--ground); color:var(--ink); font-family:var(--sans); font-size:14px;
}
.card {
  width:100%; max-width:340px; background:var(--surface);
  border:1px solid var(--line); border-radius:8px; padding:32px;
}
h1 { font-size:1.2rem; font-weight:800; margin:0 0 5px; letter-spacing:-.04em; }
.sub { font-size:.8rem; color:var(--ink-3); margin:0 0 22px; }
label { display:block; font-size:.76rem; font-weight:600; color:var(--ink-3); margin-bottom:6px; }
input {
  width:100%; padding:11px 13px; font:inherit; color:inherit;
  background:var(--ground); border:1px solid var(--line); border-radius:5px;
}
input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
button {
  width:100%; margin-top:16px; padding:11px; font:inherit; font-weight:700;
  background:var(--accent); color:var(--on-accent); border:0; border-radius:5px;
  cursor:pointer; transition:background .15s ease;
}
button:hover { background:var(--accent-deep); }
@media (prefers-reduced-motion: reduce) { button { transition:none; } }
.err { margin-top:12px; padding:11px 13px; border-radius:5px;
       background:var(--bad-bg); color:var(--bad); font-size:.83rem; }
</style>
</head>
<body>
  <form class="card" method="post">
    <h1>{{ clinic }}</h1>
    <p class="sub">콘텐츠 콘솔</p>
    <label for="pw">비밀번호</label>
    <input type="password" id="pw" name="password" autofocus autocomplete="current-password" />
    <button type="submit">들어가기</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
