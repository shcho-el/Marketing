<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>송도오블리브의원 오시는 길</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }

    #map { width: 100%; height: 100vh; }

    /* 상단 타이틀 바 */
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(26, 60, 110, 0.93);
      backdrop-filter: blur(6px);
      color: #fff;
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
    }
    .top-bar h1 { font-size: 16px; font-weight: 700; }
    .top-bar p  { font-size: 12px; opacity: .8; margin-top: 2px; }

    /* 하단 정보 패널 */
    .bottom-panel {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
      display: grid; grid-template-columns: 1fr 1fr;
    }

    .panel {
      padding: 14px 16px;
      backdrop-filter: blur(8px);
    }
    .panel-a { background: rgba(26, 60, 110, 0.88); color: #fff; }
    .panel-b { background: rgba(122, 48, 0, 0.88); color: #fff; }

    .panel-label {
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      opacity: .75; margin-bottom: 6px;
    }
    .panel-name { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
    .panel-floor { font-size: 11px; opacity: .8; line-height: 1.7; }

    .panel-nav {
      display: flex; gap: 6px; margin-top: 10px;
    }
    .nav-btn {
      flex: 1; text-align: center; padding: 7px 4px;
      border-radius: 6px; font-size: 11px; font-weight: 700;
      text-decoration: none; cursor: pointer;
      border: none; font-family: inherit;
    }
    .btn-kakao { background: #FEE500; color: #3A1D1D; }
    .btn-naver { background: #03C75A; color: #fff; }

    /* 팝업 커스텀 */
    .leaflet-popup-content-wrapper {
      border-radius: 12px !important;
      box-shadow: 0 4px 20px rgba(0,0,0,.18) !important;
    }
    .leaflet-popup-content { margin: 14px 16px !important; }
    .popup-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    .popup-row { font-size: 12px; line-height: 2; display: flex; gap: 6px; align-items: center; }
    .popup-fl {
      display: inline-block; padding: 1px 7px; border-radius: 4px;
      font-size: 11px; font-weight: 700; flex-shrink: 0;
    }
    .fl-a { background: #dce8ff; color: #1a3c6e; }
    .fl-b { background: #ffe8d6; color: #7a3000; }
  </style>
</head>
<body>

<!-- 상단 타이틀 -->
<div class="top-bar">
  <div>
    <h1>🏥 인천 송도오블리브의원 오시는 길</h1>
    <p>두 건물로 운영됩니다 · 예약하신 클리닉 위치를 확인하세요</p>
  </div>
</div>

<!-- 지도 -->
<div id="map"></div>

<!-- 하단 패널 -->
<div class="bottom-panel">
  <div class="panel panel-a">
    <div class="panel-label">🔵 A동</div>
    <div class="panel-name">아인타워대로 132번길 34</div>
    <div class="panel-floor">
      3층 · 피부체형 &amp; 롱래스팅클리닉<br>
      2층 · 문제성발톱클리닉
    </div>
    <div class="panel-nav">
      <a class="nav-btn btn-kakao" href="https://map.kakao.com/link/search/인천 연수구 아인타워대로 132번길 34" target="_blank">카카오맵</a>
      <a class="nav-btn btn-naver" href="https://map.naver.com/v5/search/인천 연수구 아인타워대로 132번길 34" target="_blank">네이버맵</a>
    </div>
  </div>
  <div class="panel panel-b">
    <div class="panel-label">🟠 B동</div>
    <div class="panel-name">테크노파크로 113 프리스페이스</div>
    <div class="panel-floor">
      5층 · 비수술재생치료클리닉 (정수 5층)<br>
      2층 · 비수술재생치료클리닉 (접수·상담)
    </div>
    <div class="panel-nav">
      <a class="nav-btn btn-kakao" href="https://map.kakao.com/link/search/인천 연수구 테크노파크로 113 프리스페이스" target="_blank">카카오맵</a>
      <a class="nav-btn btn-naver" href="https://map.naver.com/v5/search/인천 연수구 테크노파크로 113 프리스페이스" target="_blank">네이버맵</a>
    </div>
  </div>
</div>

<script>
  const coordA = [37.38778, 126.64897];
  const coordB = [37.37983, 126.65747];

  const map = L.map('map', { zoomControl: false })
    .fitBounds([coordA, coordB], { padding: [90, 60] });

  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(map);

  function makeIcon(letter, bg) {
    return L.divIcon({
      className: '',
      html: `<div style="
        background:${bg}; color:#fff; font-size:16px; font-weight:900;
        width:42px; height:42px; border-radius:50% 50% 50% 0;
        transform:rotate(-45deg); display:flex; align-items:center; justify-content:center;
        box-shadow:0 4px 12px rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.8);
      "><span style="transform:rotate(45deg)">${letter}</span></div>`,
      iconSize: [42, 42],
      iconAnchor: [21, 42],
      popupAnchor: [0, -46]
    });
  }

  L.marker(coordA, { icon: makeIcon('A', '#2d6bbf') }).addTo(map)
    .bindPopup(`
      <div class="popup-title">🔵 A동 · 아인타워대로 132번길 34</div>
      <div class="popup-row"><span class="popup-fl fl-a">3F</span> 피부체형 &amp; 롱래스팅클리닉</div>
      <div class="popup-row"><span class="popup-fl fl-a">2F</span> 문제성발톱클리닉</div>
    `, { maxWidth: 230 }).openPopup();

  L.marker(coordB, { icon: makeIcon('B', '#e05c00') }).addTo(map)
    .bindPopup(`
      <div class="popup-title">🟠 B동 · 테크노파크로 113 프리스페이스</div>
      <div class="popup-row"><span class="popup-fl fl-b">5F</span> 비수술재생치료클리닉 (정수 5층)</div>
      <div class="popup-row"><span class="popup-fl fl-b">2F</span> 비수술재생치료클리닉 (접수·상담)</div>
    `, { maxWidth: 250 });

  /* 두 건물 사이 점선 */
  L.polyline([coordA, coordB], { color: '#aaa', weight: 2, dashArray: '6 5', opacity: .7 }).addTo(map);

  /* 도보 거리 라벨 */
  const mid = [(coordA[0] + coordB[0]) / 2, (coordA[1] + coordB[1]) / 2];
  L.marker(mid, {
    icon: L.divIcon({
      className: '',
      html: `<div style="
        background:#fff8e1; border:1px solid #f5a623; border-radius:20px;
        padding:3px 11px; font-size:11px; font-weight:700; color:#5a3e00;
        white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.15);
      ">🚶‍♂️ 도보 약 8~10분</div>`,
      iconSize: [130, 26],
      iconAnchor: [65, 13]
    }),
    interactive: false
  }).addTo(map);
</script>
</body>
</html>
