name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [claude/hospital-info-update-jc0cdj]
    paths:
      - hospital-info-update-dashboard.html
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Runs without the github-pages environment so it isn't blocked by the
  # environment's branch protection. Switches the Pages source to GitHub
  # Actions (build_type=workflow) so the deploy job below is permitted.
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages (GitHub Actions source)
        uses: actions/configure-pages@v5
        with:
          enablement: true

  build:
    needs: configure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp hospital-info-update-dashboard.html _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
